version: phase1.5-frozen-2026-10-04
contract:
  - Top-1 concept accuracy and Top-k concept recall are measured only for unambiguous cases.
  - Ambiguous cases must remain unresolved or return only an allowed ambiguity set.
  - Confusable concepts must not be collapsed merely because their language overlaps.
examples:
