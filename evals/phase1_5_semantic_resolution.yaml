    acceptable_aliases: [airflow, forced flow velocity]
    ambiguous: false
    confusable_concepts: [measurement:flame_spread_velocity]
  - phrase: forced flow velocity
    canonical_concept: condition:flow_velocity
    acceptable_aliases: [airflow velocity]
    ambiguous: false
    confusable_concepts: [measurement:flame_spread_velocity]
  - phrase: flame-spread velocity
    canonical_concept: measurement:flame_spread_velocity
    acceptable_aliases: [flame spread rate]
    ambiguous: false
